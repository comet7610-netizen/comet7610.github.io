<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D canvas; floating glass HUD panels (top bar, left rooms, right inspector, bottom stats). */
:root{
  --bg:#e9e4da; --panel:rgba(250,247,240,.9); --panel-solid:#faf7f0; --fg:#2b2a27; --muted:#76736a;
  --line:rgba(43,42,39,.14); --accent:#3f7d5a; --accent-fg:#fff; --warm:#d9902f; --danger:#b5503c;
  --chip:rgba(43,42,39,.07);
  --font:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1d1f; --panel:rgba(32,33,35,.9); --panel-solid:#252628; --fg:#ece9e1; --muted:#9a978d;
  --line:rgba(236,233,225,.14); --accent:#6bbf93; --accent-fg:#102017; --warm:#e8a84a; --danger:#e0806a;
  --chip:rgba(236,233,225,.08); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1d1f; --panel:rgba(32,33,35,.9); --panel-solid:#252628; --fg:#ece9e1; --muted:#9a978d;
  --line:rgba(236,233,225,.14); --accent:#6bbf93; --accent-fg:#102017; --warm:#e8a84a; --danger:#e0806a;
  --chip:rgba(236,233,225,.08); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
#stage{position:fixed;inset:0;z-index:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;z-index:5;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
button{font:inherit;color:var(--fg);background:var(--chip);border:1px solid transparent;border-radius:8px;padding:6px 10px;cursor:pointer;min-height:32px}
button:hover{border-color:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);color:var(--accent-fg);font-weight:700}
button.primary{background:var(--accent);color:var(--accent-fg);font-weight:700}
button.warn{background:var(--warm);color:#25190a;font-weight:700}
button.ghost{background:transparent;border-color:var(--line)}
input[type=text],select{font:inherit;color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:32px;width:100%}
h3{margin:0 0 6px;font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:500;text-transform:uppercase}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

#top{top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 32px)}
#clock{font-family:var(--mono);font-size:20px;font-weight:500;min-width:62px}
#clock small{display:block;font-size:10px;color:var(--muted);font-family:var(--font)}
#left{left:max(16px,env(safe-area-inset-left,0px));top:calc(var(--topH,60px) + 20px + env(safe-area-inset-top,0px));width:176px;display:flex;flex-direction:column;gap:10px;max-height:calc(100% - 170px);overflow:auto}
.rooms{display:flex;flex-direction:column;gap:4px}
.rooms .r{display:flex;gap:6px;align-items:center}
.rooms .r button.go{flex:1;text-align:left}
.rooms .r button.lt{width:34px;padding:6px 0;text-align:center;font-family:var(--mono);font-size:11px}
#right{right:max(16px,env(safe-area-inset-right,0px));top:calc(var(--topH,60px) + 20px + env(safe-area-inset-top,0px));width:236px;max-height:calc(100% - 170px);overflow:auto;display:flex;flex-direction:column;gap:10px}
#bottom{left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 32px)}
.stat b{font-family:var(--mono);font-size:18px;font-weight:500;display:block;line-height:1.1}
.stat span{font-size:10px;color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;background:var(--chip)}
.pill.wait{background:var(--warm);color:#25190a;font-weight:700}
.pill.done{background:var(--accent);color:var(--accent-fg);font-weight:700}
.bar{height:6px;border-radius:9px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.card{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.card.sel{border-color:var(--accent)}
.log{max-height:130px;overflow:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.log div b{color:var(--fg);font-family:var(--mono);font-weight:400;margin-right:6px}
.steps{display:flex;gap:2px}
.steps i{flex:1;height:4px;border-radius:3px;background:var(--chip)}
.steps i.d{background:var(--accent)} .steps i.c{background:var(--warm)}
#modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(440px,100%);display:flex;flex-direction:column;gap:10px}
#hint{position:fixed;z-index:4;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:11px;color:var(--muted);background:var(--panel);padding:4px 10px;border-radius:99px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.lbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.lbtn .bulb{width:14px;height:18px;fill:currentColor;stroke:none;display:block}
.ibtn{padding:6px 9px;display:inline-flex;align-items:center;justify-content:center}
.lt-btn{display:none}
.sheetClose{display:none}
@media(min-width:1100px){#left{top:calc(10px + env(safe-area-inset-top,0px))}} /* same distance from the top as the time panel */
@media(min-width:1240px){#right{top:calc(10px + env(safe-area-inset-top,0px))}}
@media(max-width:820px){
  .hud{padding:8px 10px}
  .lt-btn{display:flex;align-items:center;justify-content:center;left:max(16px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));width:44px;height:38px;padding:0;font-size:18px;line-height:1;cursor:pointer}
  .rt-btn{top:calc(56px + env(safe-area-inset-top,0px))}
  #top{left:calc(max(16px,env(safe-area-inset-left,0px)) + 52px);transform:none;gap:8px;max-width:calc(100% - 68px - max(16px,env(safe-area-inset-right,0px)));justify-content:flex-start}
  .long,.wlabel{display:none}
  #clock{font-size:17px;min-width:52px}
  #left,#right{display:none}
  body.leftOpen #left,body.rightOpen #right{display:flex;position:fixed;z-index:30;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));bottom:auto;width:auto;max-height:calc(100% - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--panel-solid)}
  .sheetClose{display:block;position:sticky;top:0;align-self:flex-end;z-index:2;width:36px;height:32px;padding:0;margin-bottom:-4px}
  #bottom{gap:12px;padding:6px 12px}
  #sDept{display:none}
  .stat b{font-size:15px}
  #hint{display:none}
}
#newTask,#newMeet,#bottom{display:none!important}
</style>

<div id="stage"></div>

<button id="rightToggle" class="hud lt-btn rt-btn" aria-expanded="false" aria-label="檢視與指派任務" title="檢視／指派任務"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/></svg></button>
<div class="hud" id="top">
  <div id="clock"><span id="clk">08:00</span><small id="phase">白天</small></div>
  <div class="row" role="group" aria-label="時間">
    <button id="bDay" class="ibtn" title="白天" aria-label="白天"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button id="bNight" class="ibtn" title="夜晚" aria-label="夜晚"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    <button id="bTw" class="on"><span class="long">跟隨</span>台灣時間</button>
  </div>
  <div class="row" role="group" aria-label="天氣">
    <span class="wlabel" style="font-size:11px;color:var(--muted)">天氣</span>
    <button id="wClear" class="ibtn on" title="晴天" aria-label="晴天"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="currentColor"/><path d="M12 1.5v2.5M12 20v2.5M3.5 3.5l1.8 1.8M18.7 18.7l1.8 1.8M1.5 12H4M20 12h2.5M3.5 20.5l1.8-1.8M18.7 5.3l1.8-1.8"/></svg></button><button id="wCloud" class="ibtn" title="陰天" aria-label="陰天"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 19a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 11a4 4 0 0 1 0 8z"/></svg></button><button id="wRain" class="ibtn" title="雨天" aria-label="雨天"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 7a4 4 0 0 1 0 8z"/><path d="M8 18.5l-1 2.5M12.5 18.5l-1 2.5M17 18.5l-1 2.5"/></svg></button>
  </div>
</div>

<button id="leftToggle" class="hud lt-btn" aria-expanded="false" aria-label="視角與房間選單" title="視角／房間">☰</button>
<div class="hud" id="left">
  <button class="sheetClose" aria-label="關閉">✕</button>
  <div class="viewbtns">
    <h3>視角</h3>
    <div class="row">
      <button id="vIso" class="on">斜角</button><button id="vTop">俯視</button><button id="vPano">全景</button>
    </div>
    <h3 style="margin-top:8px">走路速度</h3>
    <div class="row"><button id="kSlow" class="on">慢</button><button id="kFast">快</button></div>
    <div class="row" style="margin-top:6px"><button id="bRoof" class="ghost" style="width:100%">天花板：隱藏</button></div>
  </div>
  <div>
    <h3>燈光</h3>
    <div class="row"><button id="lA" class="on lbtn" style="flex:1" aria-label="大廳燈光" aria-pressed="true"><svg class="bulb" viewBox="0 0 384 512" aria-hidden="true"><!-- Font Awesome Free 6 (CC BY 4.0) lightbulb, solid --><path d="M272 384c9.6-31.9 29.5-59.1 49.2-86.2l0 0c5.2-7.1 10.4-14.2 15.4-21.4c19.8-28.5 31.4-63 31.4-100.3C368 78.8 289.2 0 192 0S16 78.8 16 176c0 37.3 11.6 71.9 31.4 100.3c5 7.2 10.2 14.3 15.4 21.4l0 0c19.8 27.1 39.7 54.4 49.2 86.2H272zM192 512c44.2 0 80-35.8 80-80V416H112v16c0 44.2 35.8 80 80 80zM112 176c0 8.8-7.2 16-16 16s-16-7.2-16-16c0-61.9 50.1-112 112-112c8.8 0 16 7.2 16 16s-7.2 16-16 16c-44.2 0-80 35.8-80 80z"/></svg><span>大廳</span></button></div>
    <div class="row" style="margin-top:4px"><button id="lB" class="on lbtn" style="flex:1" aria-label="辦公室燈光" aria-pressed="true"><svg class="bulb" viewBox="0 0 384 512" aria-hidden="true"><!-- Font Awesome Free 6 (CC BY 4.0) lightbulb, solid --><path d="M272 384c9.6-31.9 29.5-59.1 49.2-86.2l0 0c5.2-7.1 10.4-14.2 15.4-21.4c19.8-28.5 31.4-63 31.4-100.3C368 78.8 289.2 0 192 0S16 78.8 16 176c0 37.3 11.6 71.9 31.4 100.3c5 7.2 10.2 14.3 15.4 21.4l0 0c19.8 27.1 39.7 54.4 49.2 86.2H272zM192 512c44.2 0 80-35.8 80-80V416H112v16c0 44.2 35.8 80 80 80zM112 176c0 8.8-7.2 16-16 16s-16-7.2-16-16c0-61.9 50.1-112 112-112c8.8 0 16 7.2 16 16s-7.2 16-16 16c-44.2 0-80 35.8-80 80z"/></svg><span>辦公室</span></button></div>
  </div>
  <div>
    <h3>房間</h3>
    <div class="rooms" id="roomList"></div>
  </div>
</div>

<div class="hud" id="right">
  <button class="sheetClose" aria-label="關閉">✕</button>
  <div id="inspect"><h3>檢視</h3><div style="color:var(--muted);line-height:1.6">點選員工、工作桌、任務看板或海報。<br>拖曳旋轉，滾輪縮放，右鍵拖曳平移。</div></div>
  <div class="card" id="newTask">
    <h3>CEO 指派任務</h3>
    <input type="text" id="ntTitle" placeholder="任務名稱，例如：春季新品視覺企劃" maxlength="40" aria-label="任務名稱">
    <label class="row" style="font-size:12px"><input type="checkbox" id="ntRes"> 需要研究部先行調查</label>
    <button class="primary" id="ntGo">指派給企劃部</button>
  </div>
  <div class="card" id="newMeet">
    <h3>召開會議</h3>
    <input type="text" id="mtTopic" placeholder="會議題目，例如：春季新品企劃討論" maxlength="40" aria-label="會議題目">
    <button class="primary" id="mtGo">開會</button>
  </div>
</div>

<div class="hud" id="bottom">
  <div class="stat"><b id="sTotal">0</b><span>總任務</span></div>

  <div class="stat"><b id="sDone">0</b><span>已完成</span></div>
  <div class="stat" id="sDept" style="font-size:11px;color:var(--muted);line-height:1.5"></div>
</div>
<div id="hint">拖曳旋轉 · 滾輪縮放 · 點選房間飛行至該空間</div>
<div id="modal" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script>
'use strict';
/* ---------- core: renderer, scene, sky, sun, camera ---------- */
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc7ea);
const camera = new THREE.PerspectiveCamera(26, 1, 1, 600);
const raycaster = new THREE.Raycaster();

const hemi = new THREE.HemisphereLight(0xdfeeff, 0x8a8576, 0.8); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 1); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 24, bottom: -24, near: 1, far: 200 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const moon = new THREE.DirectionalLight(0x8ea6ff, 0); scene.add(moon);

/* materials */
const MAT = {
  wall: new THREE.MeshStandardMaterial({ color: 0xf1ebdf, roughness: 0.9 }),
  oak: new THREE.MeshStandardMaterial({ color: 0xd7b98e, roughness: 0.7 }),
  oakDark: new THREE.MeshStandardMaterial({ color: 0xb8956a, roughness: 0.7 }),
  floor: new THREE.MeshStandardMaterial({ color: 0xd2d0cb, roughness: 0.85 }),
  black: new THREE.MeshStandardMaterial({ color: 0x1d1d1f, roughness: 0.5, metalness: 0.4 }),
  glass: new THREE.MeshStandardMaterial({ color: 0xbfe0ee, roughness: 0.05, metalness: 0.2, transparent: true, opacity: 0.22, depthWrite: false }),
  leaf: new THREE.MeshStandardMaterial({ color: 0x4f8a50, roughness: 0.8 }),
  leaf2: new THREE.MeshStandardMaterial({ color: 0x6aa35e, roughness: 0.8 }),
  pot: new THREE.MeshStandardMaterial({ color: 0xe9e4da, roughness: 0.6 }),
  fabric: new THREE.MeshStandardMaterial({ color: 0xb9b2a4, roughness: 1 }),
  fabric2: new THREE.MeshStandardMaterial({ color: 0x7e9a8a, roughness: 1 }),
  carpet: new THREE.MeshStandardMaterial({ color: 0xe4dccb, roughness: 1 }),
  carpet2: new THREE.MeshStandardMaterial({ color: 0xc9c6bf, roughness: 1 }),
  white: new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.6 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x9a9da3, roughness: 0.4, metalness: 0.6 }),
  ground: new THREE.MeshStandardMaterial({ color: 0x8fa58a, roughness: 1 }),
  paving: new THREE.MeshStandardMaterial({ color: 0xc9c6bd, roughness: 1 }),
};

function box(w, h, d, mat, x, y, z, parent, shadow = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true;
  (parent || scene).add(m); return m;
}
function cyl(rt, rb, h, mat, x, y, z, parent, seg = 16) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  (parent || scene).add(m); return m;
}
function sph(r, mat, x, y, z, parent) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat);
  m.position.set(x, y, z); m.castShadow = true; (parent || scene).add(m); return m;
}
function glassBox(w, h, d, x, y, z, parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), glassMat);
  m.position.set(x, y, z); (parent || scene).add(m); return m;
}
const glassMat = MAT.glass;

/* sky dome, stars, clouds, city lights */
const skyU = { top: { value: new THREE.Color() }, hor: { value: new THREE.Color() } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(320, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, uniforms: skyU,
  vertexShader: 'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: 'uniform vec3 top;uniform vec3 hor;varying vec3 p;void main(){float h=clamp(normalize(p).y,0.,1.);gl_FragColor=vec4(mix(hor,top,pow(h,.55)),1.);}'
}));
scene.add(sky);
const starGeo = new THREE.BufferGeometry(); {
  const a = []; for (let i = 0; i < 700; i++) { const u = Math.random() * 6.283, v = Math.random() * 1.3 + 0.1; const r = 300;
    a.push(Math.cos(u) * Math.cos(v) * r, Math.sin(v) * r, Math.sin(u) * Math.cos(v) * r); }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(a, 3));
}
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false }));
scene.add(stars);
const clouds = new THREE.Group(); scene.add(clouds);
const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, depthWrite: false, fog: false });
for (let i = 0; i < 9; i++) {

}
function moldSvg(W, H, o) {

  box.innerHTML = '<div style="display:flex;align-items:center;justify-content:space-between"><b style="font-size:16px">印刷模數計算機</b><button id="mo_x" aria-label="關閉">✕</button></div>' +
    '<div style="color:var(--muted);font-size:12px">單位 mm。算成品要用幾個 1 模拼成，不足一模也算一整模。</div>' +
    '<div style="display:flex;gap:8px;align-items:flex-end">' + fld('mw', '1 模寬') + '<span>×</span>' + fld('mh', '1 模高') + '</div>' +
    '<div style="display:flex;gap:8px;align-items:flex-end">' + fld('pw', '成品寬（不含出血）') + '<span>×</span>' + fld('ph', '成品高') + '</div>' +
    '<div style="display:flex;gap:8px">' + fld('bl', '出血（每邊）') + '</div><div id="mo_out" style="display:flex;flex-direction:column;gap:10px"></div>';
  const out = $('#mo_out');

  return null;
}
